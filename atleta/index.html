<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PT Studio</title>
    <meta name="description" content="La tua scheda, i tuoi allenamenti e i tuoi progressi" />
    <meta name="theme-color" content="#07070d" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <!-- App installabile: manifest proprio (id e scope separati dall'altra app) -->
    <!-- Manifest con indirizzo di avvio personalizzato (?u=username, su iPhone anche ?c=codice):
         l'icona sulla Home apre l'app con lo username già scritto o, con il codice, già dentro.
         Scritto qui, prima che il browser legga la pagina, perché alcuni browser leggono il manifest subito. -->
    <script>
      (function () {
        var p = new URLSearchParams(), q = new URLSearchParams(location.search), u = q.get("u"), c = q.get("c");
        try { u = u || localStorage.getItem("ptstudio_atleta_username"); } catch (e) {}
        if (u) p.set("u", u);
        if (c) p.set("c", c);
        var l = document.createElement("link");
        l.rel = "manifest";
        l.href = "/atleta/manifest.webmanifest" + (p.toString() ? "?" + p : "");
        document.head.appendChild(l);
      })();
    </script>
    <!-- iPhone: icona e apertura a schermo intero dalla schermata Home -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PT Studio" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
